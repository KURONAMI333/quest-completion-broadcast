# 開発専用の companion mod。出荷 jar には入らない (neoforge/src/gametest は jar タスクの
# 入力ではなく、./gradlew :neoforge:runGameTestServer の実行時クラスパスにだけ載る)。
#
# 値はリテラルで書く。processResources の expand は main の source set にしか設定されていないため
# ここで ${...} を書くとそのまま出力され、FML がロードを拒否する (PLAYBOOK_GAMETEST.md F13)。
modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved"
[[mods]]
modId = "questbroadcast_gametest"
version = "0.0.0"
displayName = "Quest Completion Broadcast GameTests (dev only)"
description = '''Holds the Quest Completion Broadcast GameTests. Development only; never shipped.'''
[[dependencies.questbroadcast_gametest]]
modId = "questbroadcast"
type = "required"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
